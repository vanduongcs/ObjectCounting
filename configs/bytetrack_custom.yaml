# ByteTrack Tracker Configuration
# Dựa trên ultralytics default, chỉ tùy chỉnh track_buffer theo FPS
# Tham khảo: ultralytics/cfg/trackers/bytetrack.yaml

tracker_type: bytetrack

# Thresholds — GIỮ NGUYÊN DEFAULT ultralytics
# Lý do: default đã fine-tune cho cân bằng giữa track quality và noise rejection
track_high_thresh: 0.25   # Stage 1: detection cần ≥ 0.25 để match trực tiếp
track_low_thresh: 0.1     # Stage 2: detection 0.1-0.25 được thử match với lost tracks
new_track_thresh: 0.25    # Detection cần ≥ 0.25 để tạo track MỚI (không sync với DETECTION_CONFIDENCE)

# Lifecycle — tùy chỉnh cho ứng dụng đếm
# track_buffer sẽ bị override bởi _generate_tracker_config(fps) khi chạy
# Giá trị ở đây = fallback nếu configure_tracker chưa gọi
track_buffer: 30

# Association
match_thresh: 0.8         # IoU threshold — DEFAULT (0.6 quá thấp gây match nhầm)
fuse_score: true          # Kết hợp confidence + IoU khi matching
